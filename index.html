<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernwörter-Kiste</title>
<meta name="description" content="Lernwörter für die Grundschule pflegen und zufällig abfragen.">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernwörter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F4F6FA;
  --card:#FFFFFF;
  --ink:#1B2437;
  --muted:#5D6880;
  --line:#DCE2EE;
  --ink-blue:#2743A8;
  --ink-blue-soft:#E6EBFA;
  --on-accent:#FFFFFF;
  --good:#23845A;
  --good-soft:#E2F3EA;
  --warn:#B86A00;
  --warn-soft:#FBEFD9;
  --danger:#B8352D;
  --rule:#9FB0D6;
  --rule-band:#EEF2FB;
  --rule-mid:#D6574F;
  --shadow:0 1px 2px rgba(27,36,55,.06),0 6px 20px rgba(27,36,55,.06);
  --ui:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --script:"Andika","Figtree",-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#10141D;--card:#1A2030;--ink:#E8ECF5;--muted:#9AA5BD;--line:#2B3348;
    --ink-blue:#8EA4F2;--ink-blue-soft:#232C47;--on-accent:#0E1320;
    --good:#5CC592;--good-soft:#16302A;--warn:#F0AE4B;--warn-soft:#352A15;--danger:#F07A70;
    --rule:#4A5A82;--rule-band:#1E2539;--rule-mid:#C9635B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink-blue);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:4px 16px}
header.top h1{margin:0;font-family:var(--script);font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--ink-blue)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink-blue);border-color:var(--ink-blue);color:var(--on-accent)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:17px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px;flex-shrink:0}
.btn.primary{background:var(--ink-blue);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink-blue);border:1px solid var(--line)}
.btn.good{background:var(--good);color:var(--on-accent)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
nav.tabs button{flex:1;max-width:260px;border:0;background:transparent;border-radius:12px;padding:8px;font-weight:600;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--ink-blue);background:var(--ink-blue-soft)}

/* Training */
.hero-count{display:flex;align-items:baseline;gap:10px}
.hero-count b{font-family:var(--script);font-size:44px;line-height:1;color:var(--ink-blue);font-variant-numeric:tabular-nums}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.done-good{background:var(--good)}
.progress span.done-warn{background:var(--warn)}
.progress span.now{background:var(--ink-blue)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 12px 16px;position:relative}
.sheet canvas{display:block;width:100%;height:auto}
.sheet .meta{display:flex;justify-content:space-between;padding:0 6px 8px;font-size:13px;color:var(--muted)}
.hide-word canvas{filter:blur(18px);opacity:.5}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:0;background:transparent;font-weight:600;color:var(--ink-blue);font-size:16px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--ink-blue);font-weight:600;padding:8px 4px;font-size:15px}
.result-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.result-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-family:var(--script);font-size:20px}
.result-list li:last-child{border-bottom:0}
.pill{font-family:var(--ui);font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.new{background:var(--ink-blue-soft);color:var(--ink-blue)}

/* Words */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:17px;min-height:48px}
.input.script{font-family:var(--script);font-size:20px}
textarea.input{min-height:120px;resize:vertical}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.exchange{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.group h3{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.wordlist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wordlist li+li{border-top:1px solid var(--line)}
.wordlist button{width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;text-align:left;min-height:52px}
.wordlist .w{font-family:var(--script);font-size:20px;overflow-wrap:anywhere}
.empty{text-align:center;padding:28px 12px}
.empty p{margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}
.notice{font-size:14px;background:var(--ink-blue-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin:0}
.preview{font-size:15px;border-radius:12px;padding:12px 14px;background:var(--paper);border:1px solid var(--line)}
.preview.bad{color:var(--danger)}

/* Modal sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.modal h2{margin:0;font-size:18px}
.confirm{display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:12px;padding:12px}
@media (prefers-reduced-motion:no-preference){
  .sheet.enter{animation:slide .28s ease-out}
  @keyframes slide{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Lernwörter-Kiste</h1>
    <span class="count" id="count"></span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<nav class="tabs" role="tablist">
  <button id="tabTrain" role="tab" aria-selected="true" data-tab="train">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
    Üben
  </button>
  <button id="tabWords" role="tab" aria-selected="false" data-tab="words">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg>
    Wörter
  </button>
</nav>

<div id="modalRoot"></div>

<script>
(() => {
  const LS_KEY = 'lernwoerter.words.v1';
  const PREF_KEY = 'lernwoerter.prefs.v1';
  const NO_LIST = 'Ohne Liste';
  const EXAMPLES = ['Hund','Katze','Schule','Baum','fahren','spielen','Haus','Mutter','Vater','groß','klein','Fisch'];
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  const state = {
    tab: 'train',
    words: [],
    filter: 'alle',
    size: 5,
    hide: false,
    round: null,           // {ids, idx, results:{id:'good'|'warn'}, revealed}
    search: '',
    modal: null,           // {type:'edit', id} | {type:'share'} | {type:'import', text}
    confirm: false,
    shareList: 'alle',
  };

  // ---------- Speicher (nur auf diesem Gerät) ----------
  const ls = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  };
  const prefs = ls.get(PREF_KEY, {});
  if (prefs.size) state.size = prefs.size;
  if (prefs.filter) state.filter = prefs.filter;
  if (prefs.hide) state.hide = !!prefs.hide;
  const savePrefs = () => ls.set(PREF_KEY, {size: state.size, filter: state.filter, hide: state.hide});
  state.words = ls.get(LS_KEY, []);

  function saveWords(){
    if (!ls.set(LS_KEY, state.words)) toast('Speichern hat nicht geklappt. Ist privates Surfen aktiv?');
    render();
  }
  // Safari darf die Daten dann nicht einfach aufräumen
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

  const newId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clean = s => String(s).trim().replace(/\s+/g, ' ');

  // ---------- abgeleitete Daten ----------
  const lists = () => [...new Set(state.words.map(w => (w.list || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));
  const pool = () => state.filter === 'alle' ? state.words : state.words.filter(w => (w.list||'') === state.filter);
  const byId = id => state.words.find(w => w.id === id);

  function weight(w){
    const r = w.right || 0, f = w.wrong || 0;
    let x = 1 + (2 * f) / (1 + r);
    if (!r && !f) x += 1;                                     // neue Wörter öfter
    if (w.lastAt && Date.now() - w.lastAt < 36e5) x *= 0.5;   // gerade erst geübt
    return x;
  }
  function pickRound(n){
    const cands = pool().slice(), out = [];
    while (out.length < n && cands.length){
      const total = cands.reduce((s,w)=>s+weight(w),0);
      let t = Math.random() * total, i = 0;
      for (; i < cands.length - 1; i++){ t -= weight(cands[i]); if (t <= 0) break; }
      out.push(cands.splice(i,1)[0].id);
    }
    return out;
  }

  // ---------- Austausch: Kodieren / Dekodieren ----------
  // Nachricht = lesbare Wortliste + Link. Der Link trägt die Liste exakt (#import=…),
  // die lesbaren Zeilen dienen als Rückfall, falls der Link beim Kopieren verloren geht.
  function groupWords(words){
    const g = new Map();
    words.forEach(w => { const k = (w.list||'').trim(); if (!g.has(k)) g.set(k, []); g.get(k).push(w.text); });
    return [...g.entries()].sort((a,b) => !a[0] ? 1 : !b[0] ? -1 : a[0].localeCompare(b[0],'de',{numeric:true}))
      .map(([l, ws]) => [l, ws.sort((a,b)=>a.localeCompare(b,'de'))]);
  }
  function b64urlEncode(str){
    const bytes = new TextEncoder().encode(str); let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function b64urlDecode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
    const bin = atob(s); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  const appUrl = () => location.origin + location.pathname;
  function buildMessage(words){
    const groups = groupWords(words);
    const lines = groups.map(([l, ws]) => `${l || NO_LIST}: ${ws.join(', ')}`);
    const payload = b64urlEncode(JSON.stringify({v:1, g:groups}));
    return `Lernwörter (${words.length})\n\n${lines.join('\n')}\n\nZum Übernehmen: Diese Nachricht kopieren, die Lernwörter-App öffnen und unter „Wörter“ auf „Liste empfangen“ tippen.\n${appUrl()}#import=${payload}`;
  }
  function parseMessage(text){
    // 1. exakter Weg über den Link
    const m = /#import=([A-Za-z0-9_-]+)/.exec(text || '');
    if (m){
      try {
        const data = JSON.parse(b64urlDecode(m[1]));
        if (data && Array.isArray(data.g)){
          const out = [];
          data.g.forEach(([l, ws]) => Array.isArray(ws) && ws.forEach(t => { t = clean(t); if (t) out.push({text:t, list:clean(l||'')}); }));
          if (out.length) return out;
        }
      } catch(e){ /* weiter mit den lesbaren Zeilen */ }
    }
    // 2. Rückfall: Zeilen „Liste: Wort, Wort“
    const out = [];
    String(text || '').split('\n').forEach(line => {
      line = line.trim();
      if (!line || /^Lernwörter \(\d+\)$/.test(line) || /^Zum Übernehmen/.test(line) || /^https?:\/\//.test(line)) return;
      const i = line.lastIndexOf(': ');
      if (i < 0) return;
      let l = clean(line.slice(0, i)); if (l === NO_LIST) l = '';
      line.slice(i + 2).split(',').map(clean).filter(Boolean).forEach(t => out.push({text:t, list:l}));
    });
    return out;
  }
  function importStats(items){
    const have = new Set(state.words.map(w => w.text)), seen = new Set();
    let fresh = 0;
    items.forEach(it => { if (!have.has(it.text) && !seen.has(it.text)) fresh++; seen.add(it.text); });
    return {total: seen.size, fresh};
  }
  function applyImport(items, mode){
    const old = new Map(state.words.map(w => [w.text, w]));
    if (mode === 'replace'){
      const seen = new Set(), next = [];
      items.forEach(it => {
        if (seen.has(it.text)) return; seen.add(it.text);
        const prev = old.get(it.text);
        next.push(prev ? {...prev, list: it.list} : {id:newId(), text:it.text, list:it.list, right:0, wrong:0, lastAt:0, createdAt:Date.now()});
      });
      state.words = next;
      return next.length;
    }
    let n = 0;
    items.forEach(it => {
      if (old.has(it.text)) return;
      const w = {id:newId(), text:it.text, list:it.list, right:0, wrong:0, lastAt:0, createdAt:Date.now()};
      state.words.push(w); old.set(it.text, w); n++;
    });
    return n;
  }

  // ---------- Darstellung ----------
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const val = id => { const e = document.getElementById(id); return e ? e.value : null; };
  const setVal = (id, v) => { const e = document.getElementById(id); if (e && v != null) e.value = v; };
  const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>';
  const ICON_RECEIVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2"/></svg>';

  function render(){
    const n = state.words.length;
    document.getElementById('count').textContent = n ? `${n} ${n === 1 ? 'Wort' : 'Wörter'}` : '';
    document.getElementById('tabTrain').setAttribute('aria-selected', state.tab === 'train');
    document.getElementById('tabWords').setAttribute('aria-selected', state.tab === 'words');
    if (state.tab === 'train') renderTrain(); else renderWords();
  }

  function emptyState(){
    return `<div class="panel empty">
      <p class="eyebrow">Noch keine Lernwörter</p>
      <p>Trage die Wörter ein, die dein Kind gerade in der Schule lernt. Danach schlägt die App dir jederzeit zufällige Wörter zum Diktieren vor.</p>
      <div class="stack">
        <button class="btn primary block" data-act="goWords">Wörter eintragen</button>
        <button class="btn ghost block" data-act="openImport">Liste von jemandem empfangen</button>
        <button class="btn ghost block" data-act="examples">Mit Beispielwörtern ausprobieren</button>
      </div>
    </div>`;
  }

  function renderTrain(){
    if (!state.words.length){ app.innerHTML = emptyState(); return; }
    const r = state.round;
    if (!r){
      const ls_ = lists();
      if (state.filter !== 'alle' && !ls_.includes(state.filter)) state.filter = 'alle';
      const n = pool().length;
      const hard = pool().filter(w => (w.wrong||0) > (w.right||0)).length;
      app.innerHTML = `<div class="stack">
        <section class="panel stack">
          <div>
            <p class="eyebrow">Bereit zum Üben</p>
            <div class="hero-count"><b>${n}</b><span class="muted">${n === 1 ? 'Wort' : 'Wörter'} in der Kiste${hard ? ` · ${hard} noch wackelig` : ''}</span></div>
          </div>
          ${ls_.length ? `<div class="stack" style="gap:8px"><p class="eyebrow" style="margin:0">Welche Wörter?</p>
            <div class="row">
              <button class="chip" aria-pressed="${state.filter==='alle'}" data-filter="alle">Alle</button>
              ${ls_.map(l => `<button class="chip" aria-pressed="${state.filter===l}" data-filter="${esc(l)}">${esc(l)}</button>`).join('')}
            </div></div>` : ''}
          <div class="stack" style="gap:8px"><p class="eyebrow" style="margin:0">Wie viele?</p>
            <div class="row">${[3,5,10].map(s => `<button class="chip" aria-pressed="${state.size===s}" data-size="${s}">${s} Wörter</button>`).join('')}</div>
          </div>
          <button class="btn primary block" data-act="start">Los geht's</button>
        </section>
        <p class="muted small" style="margin:0 4px">So geht's: Du liest das Wort vor, dein Kind schreibt es auf Papier. Danach vergleicht ihr und du tippst, ob es richtig war. Wörter, die noch nicht sitzen, kommen häufiger dran.</p>
        ${!standalone ? `<p class="notice">Tipp fürs iPhone: In Safari auf <b>Teilen</b> und dann <b>Zum Home-Bildschirm</b> tippen. Dann startet die Kiste wie eine App und funktioniert auch ohne Internet.</p>` : ''}
      </div>`;
      return;
    }
    if (r.idx >= r.ids.length){ renderSummary(); return; }
    const w = byId(r.ids[r.idx]);
    if (!w){ r.ids.splice(r.idx,1); render(); return; }
    const hidden = state.hide && !r.revealed;
    app.innerHTML = `<div class="stack">
      <div class="toolbar">
        <span class="muted small">Wort ${r.idx+1} von ${r.ids.length}</span>
        <button class="linkbtn" data-act="stop">Runde beenden</button>
      </div>
      <div class="progress" aria-hidden="true">${r.ids.map((id,i)=>`<span class="${r.results[id]?'done-'+r.results[id]:i===r.idx?'now':''}"></span>`).join('')}</div>
      <div class="sheet enter ${hidden?'hide-word':''}">
        <div class="meta"><span>${esc(w.list || 'Lernwort')}</span><span>${statText(w)}</span></div>
        <canvas id="lineatur" role="img" aria-label="${esc(w.text)}"></canvas>
        ${hidden ? '<button class="reveal" data-act="reveal">Antippen zum Aufdecken</button>' : ''}
      </div>
      <div class="answer">
        <button class="btn warn" data-act="mark" data-res="warn">Noch üben</button>
        <button class="btn good" data-act="mark" data-res="good">Richtig</button>
      </div>
      <div class="toolbar">
        <button class="linkbtn" data-act="toggleHide">${state.hide ? 'Wort sofort zeigen' : 'Wort erst verdecken'}</button>
        <button class="linkbtn" data-act="skip">Überspringen</button>
      </div>
    </div>`;
    drawLineatur(w.text);
  }

  function statText(w){
    const r = w.right||0, f = w.wrong||0;
    if (!r && !f) return 'neu';
    return `${r}× richtig · ${f}× geübt`;
  }

  function renderSummary(){
    const r = state.round;
    const done = r.ids.filter(id => r.results[id]);
    const good = done.filter(id => r.results[id]==='good').length;
    app.innerHTML = `<div class="stack">
      <section class="panel stack">
        <div>
          <p class="eyebrow">Runde geschafft</p>
          <div class="hero-count"><b>${good}/${done.length}</b><span class="muted">richtig geschrieben</span></div>
        </div>
        ${done.length ? `<ul class="result-list">${done.map(id => {
          const w = byId(id); if (!w) return '';
          return `<li><span>${esc(w.text)}</span>${r.results[id]==='good'?'<span class="pill good">richtig</span>':'<span class="pill warn">noch üben</span>'}</li>`;
        }).join('')}</ul>` : '<p class="muted" style="margin:0">Keine Wörter bewertet.</p>'}
      </section>
      <button class="btn primary block" data-act="start">Noch eine Runde</button>
      <button class="btn ghost block" data-act="stop">Fertig</button>
    </div>`;
  }

  function renderWords(){
    const q = state.search.trim().toLowerCase();
    const ws = state.words.filter(w => !q || w.text.toLowerCase().includes(q));
    const groups = {};
    ws.forEach(w => { const k = (w.list||'').trim() || NO_LIST; (groups[k] = groups[k] || []).push(w); });
    const keys = Object.keys(groups).sort((a,b) => a===NO_LIST ? 1 : b===NO_LIST ? -1 : a.localeCompare(b,'de',{numeric:true}));
    const ls_ = lists();
    const focusId = document.activeElement && document.activeElement.id;
    const bulkBox = document.getElementById('bulkBox');
    const keep = { newWord: val('newWord'), newList: val('newList'), bulk: val('bulk'), bulkOpen: bulkBox ? !bulkBox.hidden : false };
    if (keep.newList === null) keep.newList = state.lastList || '';
    app.innerHTML = `<div class="stack">
      <section class="panel stack">
        <p class="eyebrow" style="margin:0">Neues Lernwort</p>
        <form id="addForm" class="stack" style="gap:12px" autocomplete="off">
          <div class="add-row">
            <input id="newWord" class="input script" placeholder="z. B. Fahrrad" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lernwort">
            <button class="btn primary" type="submit">Hinzufügen</button>
          </div>
          <div class="field">
            <label for="newList">Liste (optional, z. B. „Woche 5“ oder „Diktat Tiere“)</label>
            <input id="newList" class="input" list="listOptions" placeholder="${NO_LIST}">
            <datalist id="listOptions">${ls_.map(l=>`<option value="${esc(l)}"></option>`).join('')}</datalist>
          </div>
        </form>
        <button class="linkbtn" style="align-self:flex-start" data-act="toggleBulk">${keep.bulkOpen ? 'Mehrere Wörter ausblenden' : 'Mehrere Wörter auf einmal eintragen'}</button>
        <div id="bulkBox" class="stack" style="gap:8px" ${keep.bulkOpen ? '' : 'hidden'}>
          <textarea id="bulk" class="input script" placeholder="Ein Wort pro Zeile oder durch Komma getrennt" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Mehrere Wörter"></textarea>
          <button class="btn ghost block" data-act="bulkAdd">Alle hinzufügen (Liste von oben)</button>
        </div>
      </section>
      <section class="stack" style="gap:8px">
        <p class="eyebrow" style="margin:0 4px">Mit anderen Geräten austauschen</p>
        <div class="exchange">
          <button class="btn ghost" data-act="openShare" ${state.words.length ? '' : 'disabled'}>${ICON_SHARE}Liste teilen</button>
          <button class="btn ghost" data-act="openImport">${ICON_RECEIVE}Liste empfangen</button>
        </div>
      </section>
      ${state.words.length > 6 ? `<input id="search" class="input" type="search" placeholder="Wort suchen" aria-label="Wort suchen" value="${esc(state.search)}">` : ''}
      ${!state.words.length ? `<div class="panel empty"><p class="muted">Noch keine Wörter. Trage oben das erste ein oder</p><button class="btn ghost" data-act="examples">Beispielwörter einfügen</button></div>` : ''}
      ${keys.map(k => `<section class="group">
        <h3><span>${esc(k)}</span><span>${groups[k].length}</span></h3>
        <ul class="wordlist">${groups[k].sort((a,b)=>a.text.localeCompare(b.text,'de')).map(w => `
          <li><button data-edit="${esc(w.id)}"><span class="w">${esc(w.text)}</span>${badge(w)}</button></li>`).join('')}
        </ul></section>`).join('')}
      ${state.words.length && !ws.length ? `<p class="muted">Kein Wort passt zu „${esc(state.search)}“.</p>` : ''}
    </div>`;
    setVal('newWord', keep.newWord); setVal('newList', keep.newList); setVal('bulk', keep.bulk);
    if (focusId && document.getElementById(focusId) && !state.modal) document.getElementById(focusId).focus();
  }

  function badge(w){
    const r = w.right||0, f = w.wrong||0;
    if (!r && !f) return '<span class="pill new">neu</span>';
    if (f > r) return `<span class="pill warn">${r}/${r+f} richtig</span>`;
    return `<span class="pill good">${r}/${r+f} richtig</span>`;
  }

  // ---------- Dialoge ----------
  const modalRoot = document.getElementById('modalRoot');
  function openModal(m){ state.modal = m; state.confirm = false; renderModal(); }
  function closeModal(){ state.modal = null; state.confirm = false; modalRoot.innerHTML = ''; }
  function shell(title, body){
    return `<div class="backdrop" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">${title}</h2>${body}</div></div>`;
  }

  function renderModal(){
    const m = state.modal;
    if (!m){ modalRoot.innerHTML = ''; return; }
    if (m.type === 'edit'){
      const w = byId(m.id); if (!w){ closeModal(); return; }
      const t = val('editText'), l = val('editList');
      modalRoot.innerHTML = shell('Lernwort bearbeiten', `
        <div class="field"><label for="editText">Wort</label>
          <input id="editText" class="input script" value="${esc(w.text)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="editList">Liste</label>
          <input id="editList" class="input" list="listOptions2" value="${esc(w.list||'')}" placeholder="${NO_LIST}">
          <datalist id="listOptions2">${lists().map(l=>`<option value="${esc(l)}"></option>`).join('')}</datalist></div>
        <p class="muted small" style="margin:0">Geübt: ${w.right||0}× richtig, ${w.wrong||0}× noch nicht${w.lastAt ? ', zuletzt am ' + new Date(w.lastAt).toLocaleDateString('de-DE',{day:'numeric',month:'long'}) : ''}.</p>
        <button class="btn primary block" data-act="saveEdit">Speichern</button>
        <div class="row">
          <button class="btn ghost" style="flex:1" data-act="resetStats">Zähler zurücksetzen</button>
          <button class="btn danger" style="flex:1" data-act="askConfirm">Löschen</button>
        </div>
        ${state.confirm ? `<div class="confirm"><span>„${esc(w.text)}“ wirklich löschen?</span>
          <div class="row"><button class="btn danger" style="flex:1" data-act="doDelete">Ja, löschen</button>
          <button class="btn ghost" style="flex:1" data-act="cancelConfirm">Behalten</button></div></div>` : ''}
        <button class="linkbtn" data-act="closeModal">Abbrechen</button>`);
      setVal('editText', t); setVal('editList', l);
      return;
    }
    if (m.type === 'share'){
      const ls_ = lists();
      if (state.shareList !== 'alle' && !ls_.includes(state.shareList)) state.shareList = 'alle';
      const words = state.shareList === 'alle' ? state.words : state.words.filter(w => (w.list||'') === state.shareList);
      modalRoot.innerHTML = shell('Liste teilen', `
        <p class="muted small" style="margin:0">Schick die Wörter per Nachricht, AirDrop oder Mail. Wer sie bekommt, kopiert die Nachricht und tippt in der eigenen Lernwörter-Kiste auf „Liste empfangen“. Übungszähler werden nicht mitgeschickt.</p>
        ${ls_.length ? `<div class="stack" style="gap:8px"><p class="eyebrow" style="margin:0">Was teilen?</p><div class="row">
          <button class="chip" aria-pressed="${state.shareList==='alle'}" data-sharelist="alle">Alle (${state.words.length})</button>
          ${ls_.map(l => `<button class="chip" aria-pressed="${state.shareList===l}" data-sharelist="${esc(l)}">${esc(l)}</button>`).join('')}
        </div></div>` : ''}
        <div class="preview">${words.length} ${words.length === 1 ? 'Wort' : 'Wörter'}: <span style="font-family:var(--script)">${esc(words.slice(0,8).map(w=>w.text).join(', '))}${words.length > 8 ? ' …' : ''}</span></div>
        <button class="btn primary block" data-act="doShare">${ICON_SHARE}Teilen</button>
        <button class="btn ghost block" data-act="doCopy">Als Text kopieren</button>
        <button class="linkbtn" data-act="closeModal">Abbrechen</button>`);
      return;
    }
    if (m.type === 'import'){
      const items = parseMessage(m.text);
      const st = importStats(items);
      const hasText = !!(m.text || '').trim();
      const inBrowserWithApp = m.fromLink && !standalone;
      modalRoot.innerHTML = shell('Liste empfangen', `
        ${inBrowserWithApp ? `<p class="notice">Nutzt du die Lernwörter-Kiste auf dem Home-Bildschirm? Dann tippe auf <b>Nachricht kopieren</b>, öffne die App und füge sie dort unter „Liste empfangen“ ein. Die App auf dem Home-Bildschirm hat einen eigenen Speicher.</p>
          <button class="btn ghost block" data-act="copyIncoming">Nachricht kopieren</button>` : ''}
        ${m.fromLink ? '' : `<p class="muted small" style="margin:0">Kopiere die ganze Nachricht mit der Wortliste und füge sie hier ein.</p>
        <button class="btn ghost block" data-act="pasteClipboard">Aus Zwischenablage einfügen</button>
        <textarea id="importText" class="input" placeholder="Hier einfügen" aria-label="Empfangene Nachricht" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>`}
        <div id="importPreview">${previewHtml(items, st, hasText)}</div>
        <div class="stack" style="gap:8px" id="importActions" ${st.total ? '' : 'hidden'}>
          <button class="btn primary block" data-act="doImportMerge">Neue Wörter hinzufügen</button>
          ${state.words.length ? `<button class="btn ghost block" data-act="askConfirm">Meine Liste ersetzen</button>` : ''}
          ${state.confirm ? `<div class="confirm"><span>Deine ${state.words.length} Wörter werden durch die empfangenen ${st.total} ersetzt. Übungszähler bleiben bei Wörtern erhalten, die in beiden Listen stehen.</span>
            <div class="row"><button class="btn danger" style="flex:1" data-act="doImportReplace">Ja, ersetzen</button>
            <button class="btn ghost" style="flex:1" data-act="cancelConfirm">Abbrechen</button></div></div>` : ''}
        </div>
        <button class="linkbtn" data-act="closeModal">Schließen</button>`);
      setVal('importText', m.fromLink ? null : m.text);
    }
  }
  function previewHtml(items, st, hasText){
    if (!hasText) return '';
    if (!st.total) return '<div class="preview bad">In diesem Text wurden keine Lernwörter gefunden. Kopiere bitte die ganze Nachricht.</div>';
    const lists_ = [...new Set(items.map(i => i.list || NO_LIST))];
    return `<div class="preview"><b>${st.total} ${st.total === 1 ? 'Wort' : 'Wörter'}</b>, davon ${st.fresh} neu für dich<br><span class="muted small">${esc(lists_.join(' · '))}</span></div>`;
  }

  // ---------- Grundschul-Lineatur ----------
  let lastWord = '';
  function drawLineatur(text){
    lastWord = text;
    const c = document.getElementById('lineatur'); if (!c) return;
    const cs = getComputedStyle(document.documentElement);
    const col = n => cs.getPropertyValue(n).trim();
    const W = c.parentElement.clientWidth - 24;
    const dpr = window.devicePixelRatio || 1;
    const ctx = c.getContext('2d');
    const pad = 14, fam = '"Andika", "Figtree", sans-serif';
    let size = Math.min(84, W * 0.2);
    ctx.font = `400 ${size}px ${fam}`;
    while (ctx.measureText(text).width > W - pad*2 && size > 22){ size -= 2; ctx.font = `400 ${size}px ${fam}`; }
    const m = s => ctx.measureText(s);
    const asc = m('Hdlk').actualBoundingBoxAscent || size*0.72;
    const xh = m('x').actualBoundingBoxAscent || size*0.48;
    const desc = m('gjpy').actualBoundingBoxDescent || size*0.22;
    const top = size * 0.3, base = top + asc, H = Math.ceil(base + desc + size*0.3);
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    c.style.height = H + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = col('--rule-band');           // Mittelband
    ctx.fillRect(0, base - xh, W, xh);
    const line = (y, color, w) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(0, Math.round(y)+.5); ctx.lineTo(W, Math.round(y)+.5); ctx.stroke(); };
    line(base - asc, col('--rule'), 1);           // Oberlinie
    line(base - xh, col('--rule'), 1);            // Mittellinie
    line(base, col('--rule-mid'), 1.5);           // Grundlinie
    line(base + desc, col('--rule'), 1);          // Unterlinie
    ctx.font = `400 ${size}px ${fam}`;
    ctx.fillStyle = col('--ink-blue');
    ctx.textBaseline = 'alphabetic';
    const tw = ctx.measureText(text).width;
    ctx.fillText(text, Math.max(pad, (W - tw)/2), base);
  }
  const redraw = () => { if (document.getElementById('lineatur') && lastWord) drawLineatur(lastWord); };
  window.addEventListener('resize', redraw);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw); } catch(e){}
  if (document.fonts) document.fonts.load('400 40px "Andika"').then(redraw).catch(()=>{});

  // ---------- Bildschirm während einer Runde anlassen ----------
  let lock = null;
  async function keepAwake(on){
    try {
      if (on && !lock && navigator.wakeLock) lock = await navigator.wakeLock.request('screen');
      if (!on && lock){ await lock.release(); lock = null; }
    } catch(e){ lock = null; }
  }

  // ---------- Aktionen ----------
  function parseWords(s){ return s.split(/[\n,;]+/).map(clean).filter(Boolean); }
  function addWords(texts, list){
    const existing = new Set(state.words.map(w => w.text));
    const fresh = [...new Set(texts)].filter(t => !existing.has(t));
    fresh.forEach(text => state.words.push({id:newId(), text, list: list||'', right:0, wrong:0, lastAt:0, createdAt:Date.now()}));
    if (fresh.length){ saveWords(); toast(fresh.length === 1 ? `„${fresh[0]}“ hinzugefügt` : `${fresh.length} Wörter hinzugefügt`); }
    else if (texts.length) toast('Steht schon in der Kiste');
    return fresh.length;
  }

  async function copyText(text){
    try { await navigator.clipboard.writeText(text); return true; }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
      ta.remove(); return ok;
    }
  }

  let toastTimer;
  function toast(msg){
    let t = document.querySelector('.toast');
    if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }

  function sharedWords(){ return state.shareList === 'alle' ? state.words : state.words.filter(w => (w.list||'') === state.shareList); }

  document.addEventListener('click', async e => {
    const tab = e.target.closest('[data-tab]');
    if (tab){ state.tab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
    const f = e.target.closest('[data-filter]');
    if (f){ state.filter = f.dataset.filter; savePrefs(); render(); return; }
    const s = e.target.closest('[data-size]');
    if (s){ state.size = +s.dataset.size; savePrefs(); render(); return; }
    const sl = e.target.closest('[data-sharelist]');
    if (sl){ state.shareList = sl.dataset.sharelist; renderModal(); return; }
    const ed = e.target.closest('[data-edit]');
    if (ed){ modalRoot.innerHTML = ''; openModal({type:'edit', id: ed.dataset.edit}); return; }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const act = a.dataset.act;
    if (act === 'closeModal' && a.classList.contains('backdrop') && e.target !== a) return; // Klick im Dialog
    const r = state.round;
    switch (act){
      case 'goWords': state.tab = 'words'; render(); setTimeout(()=>{const i=document.getElementById('newWord'); i&&i.focus();},50); break;
      case 'examples': addWords(EXAMPLES, 'Beispiel'); break;
      case 'start': {
        const ids = pickRound(state.size);
        if (!ids.length){ toast('In dieser Auswahl sind keine Wörter.'); break; }
        state.round = {ids, idx:0, results:{}, revealed:false}; keepAwake(true); render(); window.scrollTo(0,0); break;
      }
      case 'stop': state.round = null; keepAwake(false); render(); break;
      case 'reveal': r.revealed = true; render(); break;
      case 'toggleHide': state.hide = !state.hide; savePrefs(); render(); break;
      case 'skip': r.idx++; r.revealed = false; render(); break;
      case 'mark': {
        const id = r.ids[r.idx], w = byId(id), res = a.dataset.res;
        r.results[id] = res; r.idx++; r.revealed = false;
        if (w){ w.right = (w.right||0) + (res==='good'?1:0); w.wrong = (w.wrong||0) + (res==='warn'?1:0); w.lastAt = Date.now(); }
        if (r.idx >= r.ids.length) keepAwake(false);
        saveWords();
        break;
      }
      case 'toggleBulk': { const b = document.getElementById('bulkBox'); b.hidden = !b.hidden; a.textContent = b.hidden ? 'Mehrere Wörter auf einmal eintragen' : 'Mehrere Wörter ausblenden'; if(!b.hidden) document.getElementById('bulk').focus(); break; }
      case 'bulkAdd': {
        const list = clean(val('newList')||''); state.lastList = list;
        if (addWords(parseWords(val('bulk')||''), list)) setVal('bulk', '');
        break;
      }
      case 'saveEdit': {
        const w = byId(state.modal.id); if (!w) break;
        const text = clean(val('editText')), list = clean(val('editList'));
        if (!text){ toast('Das Wort darf nicht leer sein.'); break; }
        if (text !== w.text && state.words.some(x => x.text === text)){ toast('Dieses Wort gibt es schon.'); break; }
        w.text = text; w.list = list; closeModal(); saveWords(); toast('Gespeichert');
        break;
      }
      case 'resetStats': { const w = byId(state.modal.id); if (w){ w.right = 0; w.wrong = 0; w.lastAt = 0; saveWords(); renderModal(); toast('Zähler zurückgesetzt'); } break; }
      case 'askConfirm': state.confirm = true; renderModal(); break;
      case 'cancelConfirm': state.confirm = false; renderModal(); break;
      case 'doDelete': { const w = byId(state.modal.id); closeModal(); if (w){ state.words = state.words.filter(x => x.id !== w.id); saveWords(); toast(`„${w.text}“ gelöscht`); } break; }
      case 'closeModal': closeModal(); break;

      // Austausch
      case 'openShare': openModal({type:'share'}); break;
      case 'doShare': {
        const text = buildMessage(sharedWords());
        if (navigator.share){
          try { await navigator.share({text}); closeModal(); }
          catch(err){ if (err && err.name !== 'AbortError'){ if (await copyText(text)) toast('Teilen ging nicht. Text ist kopiert.'); } }
        } else if (await copyText(text)){ toast('Kopiert. Jetzt in eine Nachricht einfügen.'); closeModal(); }
        else toast('Kopieren hat nicht geklappt.');
        break;
      }
      case 'doCopy': {
        if (await copyText(buildMessage(sharedWords()))){ toast('Kopiert. Jetzt in eine Nachricht einfügen.'); closeModal(); }
        else toast('Kopieren hat nicht geklappt.');
        break;
      }
      case 'openImport': openModal({type:'import', text:''}); setTimeout(()=>{const t=document.getElementById('importText'); t&&t.focus();},60); break;
      case 'pasteClipboard': {
        try {
          const t = await navigator.clipboard.readText();
          state.modal.text = t; renderModal();
          if (!t.trim()) toast('Die Zwischenablage ist leer.');
        } catch(err){ toast('Bitte lange ins Feld tippen und „Einsetzen“ wählen.'); const t = document.getElementById('importText'); t && t.focus(); }
        break;
      }
      case 'copyIncoming': { if (await copyText(state.modal.text)) toast('Kopiert. Jetzt die App öffnen.'); else toast('Kopieren hat nicht geklappt.'); break; }
      case 'doImportMerge': case 'doImportReplace': {
        const items = parseMessage(state.modal.text);
        const n = applyImport(items, act === 'doImportReplace' ? 'replace' : 'merge');
        closeModal(); saveWords(); state.tab = 'words'; render();
        toast(act === 'doImportReplace' ? `Liste ersetzt: ${n} Wörter` : n ? `${n} neue ${n === 1 ? 'Wort' : 'Wörter'} übernommen` : 'Alle Wörter waren schon da');
        break;
      }
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'addForm') return;
    e.preventDefault();
    const inp = document.getElementById('newWord');
    const list = clean(val('newList')||''); state.lastList = list;
    const texts = parseWords(inp.value);
    if (!texts.length){ inp.focus(); return; }
    inp.value = '';
    addWords(texts, list);
    const again = document.getElementById('newWord'); if (again) again.focus();
  });

  let searchTimer;
  document.addEventListener('input', e => {
    if (e.target.id === 'search'){
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.search = e.target.value; render(); }, 120);
    }
    if (e.target.id === 'importText' && state.modal){
      state.modal.text = e.target.value;
      const items = parseMessage(state.modal.text), st = importStats(items);
      document.getElementById('importPreview').innerHTML = previewHtml(items, st, !!state.modal.text.trim());
      document.getElementById('importActions').hidden = !st.total;
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) closeModal(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.round && state.round.idx < state.round.ids.length) keepAwake(true); });

  // Geöffneter Teilen-Link (#import=…)
  function checkIncomingLink(){
    if (!/^#import=/.test(location.hash)) return;
    const text = location.href;
    history.replaceState(null, '', location.pathname + location.search);
    if (parseMessage(text).length) openModal({type:'import', text, fromLink:true});
  }
  window.addEventListener('hashchange', checkIncomingLink);

  render();
  checkIncomingLink();

  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
